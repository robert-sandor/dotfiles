# Loaded into every Vulkan app via MANGOHUD=1 (see environment.d/mangohud.conf)

# Built-in presets match the SteamOS performance overlay levels:
#   0 = off, 1 = FPS only, 2 = horizontal bar, 3 = extended, 4 = detailed
# Starts off; MangoHud remembers the last level used
preset=0,1,2,3,4

# Keybinds
# Right Shift+F12: cycle overlay level (0 -> 1 -> 2 -> 3 -> 4 -> 0)
toggle_preset=Shift_R+F12
# Right Shift+F10: show/hide (moved off F12 so it doesn't clash with the above)
toggle_hud=Shift_R+F10
# Right Shift+F11: cycle corners
toggle_hud_position=Shift_R+F11

# Pixels, not scaled with the desktop - sized for a 5K display
font_size=40
