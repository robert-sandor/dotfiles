[bar]
order = ["top_bar"]

[bar.top_bar]
margin_edge = 0
margin_ends = 0
radius_top_left = 0
radius_top_right = 0
radius_bottom_left = 12
radius_bottom_right = 12
start = ["workspaces"]
center = ["media", "clock"]
end = ["tray", "network", "bluetooth", "volume", "brightness", "battery", "control-center", "notifications", "session"]

[battery]
warning_threshold = 20

[brightness]
enable_ddcutil = true
sync_all_monitors = true

[location]
address = "Cluj-Napoca, Romania"

[lockscreen]
enabled = true
lock_before_suspend = true
fingerprint = true
blurred_desktop = true
transition = ["fade"]
transition_duration = 500
blur_intensity = 1.0

[shell]
font_family = "JetBrainsMono Nerd Font"
polkit_agent = true

[shell.animation]
speed = 3.0

[shell.launcher]
categories = false  # show launcher category filters; Tab toggles them while open
compact = true  # smaller icons and tighter rows; hides subtitles

[shell.launcher.providers.calculator]
prefix = "calc"  # trigger word for calculator expressions (e.g. "/calc")
global = true  # also show calculator results in un-prefixed search

[shell.launcher.providers.emoji]
prefix = "emo"  # trigger word (triggers on provider_prefix + trigger, e.g. "/emo")

[shell.launcher.providers.session]
prefix = "session"  # trigger word for session actions (e.g. "/session")
global = true  # set true to also include session actions in un-prefixed search

[shell.launcher.providers.wallpaper]
prefix = "wall"  # trigger word for wallpaper selector (e.g. "/wall")

[shell.launcher.providers.windows]
prefix = "win"  # trigger word for windows (e.g. "/win")
global = true

[shell.panel]
open_near_click_control_center = true
launcher_placement = "attached"
launcher_position = "center"
clipboard_placement = "attached"
clipboard_position = "auto"

[theme]
source = "community"
community_palette = "Catppuccin Mocha Peach"

[theme.templates]
builtin_ids = ["niri"]

[wallpaper.default]
path = "/home/rsandor/Pictures/Wallpapers/lac_gilau_2026.png"

[widget.battery]
display_mode = "graphic"
show_label = false

[widget.brightness]
show_label = false

[widget.control-center]
glyph = "settings-filled"

[widget.media]
hide_when_no_media = true

[widget.network]
show_label = false
vpn_status = "both"

[widget.notifications]
hide_when_no_unread = true

[widget.volume]
show_label = false

[widget.wallpaper]
enabled = false

[widget.workspaces]
style = "minimal"
